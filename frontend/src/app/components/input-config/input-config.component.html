<div class="bg-slate-800/70 border-b border-slate-700 px-4 py-2 flex flex-wrap items-center gap-x-4 gap-y-2 flex-shrink-0 text-xs">

  <!-- ===== SORTING ===== -->
  <ng-container *ngIf="category === 'sorting'">
    <span class="text-slate-400 font-semibold whitespace-nowrap">📊 排序输入</span>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">数组:</span>
      <input
        type="text"
        [(ngModel)]="sortArrayInput"
        (keyup.enter)="applySortArray()"
        placeholder="如: 64, 34, 25, 12"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-44 focus:outline-none focus:border-blue-500">
      <button (click)="applySortArray()"
        class="px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium">确认</button>
    </div>

    <div class="w-px h-4 bg-slate-600 hidden sm:block"></div>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">随机大小:</span>
      <input type="number" [(ngModel)]="sortSize" min="3" max="30"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-14 focus:outline-none focus:border-blue-500">
      <button (click)="randomSortArray()"
        class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-white">🎲 随机生成</button>
    </div>
  </ng-container>

  <!-- ===== SEARCH ===== -->
  <ng-container *ngIf="category === 'search'">
    <span class="text-slate-400 font-semibold whitespace-nowrap">🔍 搜索输入</span>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">有序数组:</span>
      <input
        type="text"
        [(ngModel)]="searchArrayInput"
        (keyup.enter)="applySearch()"
        placeholder="如: 1, 3, 5, 7, 9"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-40 focus:outline-none focus:border-blue-500">
    </div>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">目标值:</span>
      <input
        type="number"
        [(ngModel)]="searchTargetInput"
        (keyup.enter)="applySearch()"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-16 focus:outline-none focus:border-blue-500">
      <button (click)="applySearch()"
        class="px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium">确认</button>
    </div>

    <button (click)="randomSearch()"
      class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-white">🎲 随机</button>
  </ng-container>

  <!-- ===== GRAPH ===== -->
  <ng-container *ngIf="category === 'graph'">
    <span class="text-slate-400 font-semibold whitespace-nowrap">🕸 图输入</span>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">节点:</span>
      <input
        type="text"
        [(ngModel)]="nodesInput"
        placeholder="如: A, B, C, D"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-28 focus:outline-none focus:border-blue-500">
    </div>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">边 (A-B:权重):</span>
      <input
        type="text"
        [(ngModel)]="edgesInput"
        placeholder="如: A-B:4, B-C:2"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-44 focus:outline-none focus:border-blue-500">
    </div>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">起点:</span>
      <input type="text" [(ngModel)]="graphStartInput"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-10 text-center focus:outline-none focus:border-blue-500">
      <span class="text-slate-500">终点:</span>
      <input type="text" [(ngModel)]="graphEndInput"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-10 text-center focus:outline-none focus:border-blue-500">
    </div>

    <div class="flex items-center gap-2">
      <label class="flex items-center gap-1 cursor-pointer text-slate-400">
        <input type="checkbox" [(ngModel)]="isDirected" class="accent-blue-500"> 有向图
      </label>
      <label class="flex items-center gap-1 cursor-pointer text-slate-400">
        <input type="checkbox" [(ngModel)]="isWeighted" class="accent-blue-500"> 带权重
      </label>
    </div>

    <button (click)="applyGraph(true)"
      class="px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium">确认</button>
    <button (click)="randomGraph()"
      class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-white">🎲 随机图</button>
  </ng-container>

  <!-- ===== DP ===== -->
  <ng-container *ngIf="category === 'dp'">
    <span class="text-slate-400 font-semibold whitespace-nowrap">💡 背包输入</span>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">物品 (名:重:值):</span>
      <input
        type="text"
        [(ngModel)]="itemsInput"
        (keyup.enter)="applyDP()"
        placeholder="如: A:2:3, B:3:4"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-52 focus:outline-none focus:border-blue-500">
    </div>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">背包容量:</span>
      <input
        type="number"
        [(ngModel)]="capacity"
        min="1"
        max="50"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-14 focus:outline-none focus:border-blue-500">
      <button (click)="applyDP()"
        class="px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium">确认</button>
    </div>

    <button (click)="randomDP()"
      class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-white">🎲 随机</button>
  </ng-container>

  <!-- ===== BACKTRACKING (N-Queens) ===== -->
  <ng-container *ngIf="category === 'backtracking'">
    <span class="text-slate-400 font-semibold whitespace-nowrap">♟ 皇后设置</span>

    <div class="flex items-center gap-2">
      <span class="text-slate-500">N 值:</span>
      <input
        type="range"
        [(ngModel)]="queensN"
        min="4"
        max="12"
        class="w-32 accent-blue-500">
      <span class="text-white font-mono w-6 text-center">{{ queensN }}</span>
      <span class="text-slate-500">皇后</span>
      <button (click)="applyQueens()"
        class="px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium">确认</button>
    </div>
    <span class="text-slate-500 italic">（N=8 即经典八皇后问题）</span>
  </ng-container>

  <!-- ===== DIVIDE & CONQUER ===== -->
  <ng-container *ngIf="category === 'divide-conquer'">
    <span class="text-slate-400 font-semibold whitespace-nowrap">🌳 分治输入</span>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">大整数 X:</span>
      <input
        type="text"
        [(ngModel)]="divideX"
        (keyup.enter)="applyDivideConquer()"
        placeholder="如: 12345678"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-36 focus:outline-none focus:border-blue-500">
    </div>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">大整数 Y:</span>
      <input
        type="text"
        [(ngModel)]="divideY"
        (keyup.enter)="applyDivideConquer()"
        placeholder="如: 87654321"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-36 focus:outline-none focus:border-blue-500">
      <button (click)="applyDivideConquer()"
        class="px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium">确认</button>
    </div>

    <button (click)="randomDivideConquer()"
      class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-white">🎲 随机</button>

    <span class="text-slate-500 italic">使用 Karatsuba 分治乘法生成递归树</span>
  </ng-container>

  <!-- ===== VR/3D ===== -->
  <ng-container *ngIf="category === 'vr-3d'">
    <span class="text-slate-400 font-semibold whitespace-nowrap">🧊 3D 数据结构</span>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">结构:</span>
      <button
        *ngFor="let item of vr3dTypes"
        (click)="selectVr3dStructure(item.id)"
        [class]="store.vr3dStructure() === item.id
          ? 'px-2 py-1 bg-blue-600 rounded text-white font-medium'
          : 'px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-300'">
        {{ item.label }}
      </button>
    </div>

    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">数据:</span>
      <input
        type="text"
        [(ngModel)]="vr3dInput"
        (keyup.enter)="applyVr3dData()"
        placeholder="如: 10, 20, 30, 40"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white w-80 focus:outline-none focus:border-blue-500">
      <button
        (click)="applyVr3dData()"
        class="px-2 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium">
        生成 3D 模型
      </button>
    </div>

    <button
      (click)="randomVr3dData()"
      class="px-2 py-1 bg-slate-600 hover:bg-slate-500 rounded text-white">
      🎲 随机数据
    </button>

    <span class="text-slate-500 italic">{{ vr3dInputHint }}</span>
  </ng-container>

</div>
