<div class="flex-1 p-6 overflow-y-auto">
  <div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-white">算法运行历史</h2>
      <button (click)="load()" class="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-sm text-slate-300">
        🔄 刷新
      </button>
    </div>

    <div *ngIf="loading" class="flex justify-center py-12">
      <div class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div *ngIf="!loading && history.length === 0" class="text-center py-12 text-slate-500">
      <div class="text-4xl mb-3">📋</div>
      <p>暂无历史记录</p>
    </div>

    <div *ngIf="!loading && history.length > 0" class="space-y-2">
      <div *ngFor="let item of history"
        class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 flex items-center justify-between hover:border-slate-600">
        <div class="flex items-center gap-3">
          <span class="px-2 py-0.5 rounded text-xs font-medium bg-blue-600/20 text-blue-400">{{ item.category }}</span>
          <span class="font-medium text-white text-sm">{{ item.algorithm }}</span>
          <span class="text-xs text-slate-500">{{ item.stepCount }} 步</span>
          <span class="text-xs text-slate-500">比较 {{ item.comparisons }} 次</span>
          <span *ngIf="item.swaps > 0" class="text-xs text-slate-500">交换 {{ item.swaps }} 次</span>
          <span class="text-xs text-slate-500">{{ item.executionTimeMs }}ms</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs text-slate-600">{{ item.createdAt | date:'MM-dd HH:mm' }}</span>
          <button (click)="delete(item.id)" class="text-slate-600 hover:text-red-400 text-sm">✕</button>
        </div>
      </div>
    </div>
  </div>
</div>
