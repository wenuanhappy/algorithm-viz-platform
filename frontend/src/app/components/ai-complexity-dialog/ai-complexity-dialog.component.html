<div
        *ngIf="store.aiDialogOpen()"
        class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center px-4">
    <div class="w-full max-w-5xl max-h-[90vh] flex overflow-hidden rounded-xl bg-slate-900 border border-slate-700 shadow-2xl">
        
        <!-- Sidebar: Conversation History -->
        <div class="w-64 flex-shrink-0 border-r border-slate-700 bg-slate-800/50 flex flex-col">
            <div class="p-4 border-b border-slate-700">
                <button 
                    (click)="createNewChat()"
                    class="w-full py-2 px-3 rounded-md bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium transition-colors flex items-center justify-center gap-2">
                    <span>+</span> 新对话
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-1">
                <div *ngIf="sessionsLoading" class="text-center py-4 text-slate-500 text-xs">加载中...</div>
                <div *ngIf="!sessionsLoading && sessions.length === 0" class="text-center py-4 text-slate-500 text-xs text-balance">暂无历史对话</div>
                
                <div *ngFor="let s of sessions" 
                     (click)="selectSession(s)"
                     [class.bg-slate-700]="currentSessionId === s.id"
                     [class.text-white]="currentSessionId === s.id"
                     [class.text-slate-400]="currentSessionId !== s.id"
                     class="group relative w-full text-left px-3 py-2 rounded-md hover:bg-slate-700/50 cursor-pointer transition-all">
                    <div class="text-sm truncate pr-6">{{ s.title }}</div>
                    <div class="text-[10px] opacity-50">{{ s.createdAt | date:'MM-dd HH:mm' }}</div>
                    <button 
                        (click)="deleteSession($event, s.id)"
                        class="absolute right-2 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 transition-opacity">
                        <span class="text-xs">×</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0">
            <div class="flex items-center justify-between px-5 py-4 border-b border-slate-700">
                <div>
                    <h2 class="text-lg font-bold text-white">AI 助手对话</h2>
                    <p class="text-xs text-slate-400 mt-1">
                        提问或粘贴代码/伪代码，AI 将直接回答你的问题
                    </p>
                </div>

                <button
                        type="button"
                        (click)="closeAlgorithmDialog()"
                        class="text-slate-400 hover:text-white text-xl">
                    ×
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-4 bg-slate-900 chat-messages-container">
                <!-- Chat History Messages -->
                <div *ngIf="conversation.length > 0" class="space-y-4 mb-6">
                    <div *ngFor="let msg of conversation" class="flex flex-col"
                         [class.items-end]="msg.role === 'user'"
                         [class.items-start]="msg.role === 'assistant'">
                        <div class="max-w-[85%] rounded-lg px-4 py-2 text-sm shadow-sm"
                             [class.bg-purple-600]="msg.role === 'user'"
                             [class.bg-slate-800]="msg.role === 'assistant'"
                             [class.text-white]="msg.role === 'user'"
                             [class.text-slate-200]="msg.role === 'assistant'"
                             [class.border]="msg.role === 'assistant'"
                             [class.border-slate-700]="msg.role === 'assistant'">
                            <div class="text-[10px] mb-1 opacity-70">
                                {{ msg.role === 'assistant' ? 'AI 助手' : '你' }}
                            </div>
                            <div class="whitespace-pre-wrap leading-relaxed">{{ msg.content }}</div>
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="sticky bottom-0 bg-slate-900 pt-2 border-t border-slate-800">
                    <label class="block">
                        <textarea
                                [(ngModel)]="algorithmCode"
                                rows="4"
                                (keydown.control.enter)="analyzeAlgorithmComplexity()"
                                class="w-full rounded-md bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-slate-100 font-sans focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all"
                                placeholder="输入你的问题或粘贴代码... (Ctrl+Enter 发送)"></textarea>
                    </label>

                    <div *ngIf="algorithmError" class="mt-2 rounded-md border border-red-700 bg-red-950/60 px-3 py-2 text-sm text-red-200">
                        {{ algorithmError }}
                    </div>

                    <div class="flex justify-end gap-2 py-3">
                        <button
                                type="button"
                                (click)="analyzeAlgorithmComplexity()"
                                [disabled]="algorithmLoading"
                                class="px-6 py-2 rounded-md bg-purple-600 hover:bg-purple-500 disabled:opacity-60 text-sm text-white font-medium transition-all shadow-lg shadow-purple-900/20">
                            {{ algorithmLoading ? '正在思考...' : '发送' }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
