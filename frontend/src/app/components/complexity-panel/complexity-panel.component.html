<div *ngIf="algoInfo() as info"
  class="bg-slate-900/80 border-b border-slate-700 px-4 py-2 flex flex-wrap items-center gap-x-5 gap-y-1.5 flex-shrink-0 text-xs">

  <!-- Algorithm name + complexity tags -->
  <div class="flex items-center gap-2 flex-shrink-0">
    <span class="text-slate-300 font-semibold">{{ info.name }}</span>

    <span class="px-1.5 py-0.5 rounded border border-slate-600 text-slate-400 font-mono">
      时间 <span [class]="timeClass(info.timeClass)">{{ info.time }}</span>
    </span>
    <span *ngIf="info.worstTime !== info.time" class="px-1.5 py-0.5 rounded border border-slate-600 text-slate-400 font-mono">
      最差 <span class="text-orange-400">{{ info.worstTime }}</span>
    </span>
    <span class="px-1.5 py-0.5 rounded border border-slate-600 text-slate-400 font-mono">
      空间 <span class="text-purple-400">{{ info.space }}</span>
    </span>
  </div>

  <div class="w-px h-4 bg-slate-700 hidden sm:block flex-shrink-0"></div>

  <!-- Step progress -->
  <div *ngIf="store.totalSteps() > 0" class="flex items-center gap-2 flex-shrink-0">
    <span class="text-slate-500">执行进度</span>
    <div class="w-24 bg-slate-700 rounded-full h-1.5">
      <div class="bg-blue-500 h-1.5 rounded-full transition-all duration-200"
        [style.width.%]="stepProgress()"></div>
    </div>
    <span class="text-slate-400 font-mono">
      {{ store.currentStep() + 1 }}/{{ store.totalSteps() }}
    </span>
  </div>

  <!-- Dynamic metrics with progress bars -->
  <ng-container *ngIf="metrics() as m">
    <div class="w-px h-4 bg-slate-700 hidden sm:block flex-shrink-0"></div>

    <div class="flex items-center gap-4 flex-wrap">
      <div *ngFor="let item of m.items" class="flex items-center gap-1.5">
        <span class="text-slate-500">{{ item.label }}:</span>
        <span [class]="metricTextColor(item.color)" class="font-mono font-bold">{{ item.value }}</span>
        <ng-container *ngIf="item.max !== null && item.max > 0">
          <div class="w-16 bg-slate-700 rounded-full h-1.5">
            <div class="h-1.5 rounded-full transition-all duration-300"
              [ngClass]="metricColor(item.color)"
              [style.width.%]="barWidth(item.value, item.max)"></div>
          </div>
          <span class="text-slate-600 font-mono">/{{ item.max }}</span>
        </ng-container>
      </div>
    </div>

    <span *ngIf="m.extra" class="text-slate-600 italic ml-1">{{ m.extra }}</span>
  </ng-container>

</div>
