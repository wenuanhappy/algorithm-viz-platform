<aside class="w-56 h-full bg-slate-900 border-r border-slate-700 flex flex-col overflow-hidden">
  <div class="px-3 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider border-b border-slate-700 flex-shrink-0">
    学习内容
  </div>

  <div class="flex-1 overflow-y-auto py-2 min-h-0">
    <div *ngFor="let group of groups" class="mb-1">
      <div class="px-3 py-1.5 text-xs font-semibold text-slate-400 flex items-center gap-1.5">
        <span class="font-mono text-[10px] text-slate-500">{{ group.icon }}</span>
        <span>{{ group.category }}</span>
      </div>

      <button
        *ngFor="let item of group.items"
        (click)="select(item.id)"
        [class]="store.selectedAlgo() === item.id
          ? 'block w-full pl-4 pr-2 py-2 text-left text-sm bg-blue-600/20 text-blue-400 border-l-2 border-blue-500'
          : 'block w-full pl-4 pr-2 py-2 text-left text-sm text-slate-400 hover:text-white hover:bg-slate-800 border-l-2 border-transparent'">
        <div class="font-medium leading-none truncate">{{ item.label }}</div>
        <div class="text-xs text-slate-500 mt-0.5 font-mono truncate">{{ item.complexity }}</div>
      </button>
    </div>
  </div>

  <div class="border-t border-slate-700 px-3 py-2 flex-shrink-0">
    <button
      (click)="store.toggleCompareMode()"
      [class]="store.compareMode()
        ? 'w-full px-3 py-2 rounded text-xs font-medium bg-purple-600/30 text-purple-400 border border-purple-600/50 flex items-center gap-1.5 justify-center'
        : 'w-full px-3 py-2 rounded text-xs font-medium text-slate-500 hover:text-slate-300 hover:bg-slate-800 border border-slate-700 flex items-center gap-1.5 justify-center'">
      <span>对比模式</span>
      <span *ngIf="store.compareMode()" class="text-purple-400">已开启</span>
    </button>

    <div *ngIf="store.compareMode()" class="mt-2">
      <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1.5 px-1">对比算法</div>
      <button
        *ngFor="let item of compareSiblings()"
        (click)="selectCompare(item.id)"
        [class]="store.compareAlgo() === item.id
          ? 'w-full text-left px-3 py-1.5 text-xs rounded bg-purple-600/20 text-purple-400 border-l-2 border-purple-500'
          : 'w-full text-left px-3 py-1.5 text-xs rounded text-slate-500 hover:text-slate-300 hover:bg-slate-800 border-l-2 border-transparent'">
        {{ item.label }}
      </button>
      <div *ngIf="compareSiblings().length === 0" class="text-[10px] text-slate-600 px-1">
        当前分类暂无可对比算法
      </div>
    </div>
  </div>
</aside>
