<div class="flex-1 flex flex-col overflow-auto p-6">
  <div class="max-w-2xl mx-auto w-full">

    <h2 class="text-lg font-bold text-white mb-6">评估测试设置</h2>

    <!-- Question Count -->
    <div class="mb-6">
      <label class="block text-sm text-slate-400 mb-2">题目数量</label>
      <div class="flex items-center gap-2 flex-wrap">
        <span *ngFor="let n of [3, 5, 7, 10]"
          (click)="setCount(n)"
          class="px-4 py-1.5 rounded text-sm font-medium transition-all cursor-pointer select-none"
          [class.bg-blue-600]="questionCount() === n && !customCount()"
          [class.text-white]="questionCount() === n && !customCount()"
          [class.bg-slate-700]="!(questionCount() === n && !customCount())"
          [class.text-slate-300]="!(questionCount() === n && !customCount())"
          [class.hover:bg-slate-600]="!(questionCount() === n && !customCount())"
          role="button">
          {{ n }}
        </span>
        <input
          type="number" min="1" max="15"
          [ngModel]="customCount()"
          (ngModelChange)="setCustomCount($event)"
          placeholder="自定义"
          class="w-20 bg-slate-800 border border-slate-600 rounded px-3 py-1.5 text-sm text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none" />
      </div>
    </div>

    <!-- API Status -->
    <div *ngIf="!aiAvailable" class="mb-6 p-3 bg-yellow-900/20 border border-yellow-700/50 rounded-lg">
      <div class="flex items-start gap-2">
        <span class="text-yellow-400 text-sm mt-0.5">⚠️</span>
        <div>
          <p class="text-sm text-yellow-300 font-medium">AI 功能未配置</p>
          <p class="text-xs text-slate-400 mt-0.5">
            在 <code class="text-yellow-400/80 bg-slate-800 px-1 rounded">application.properties</code> 中设置 <code class="text-yellow-400/80 bg-slate-800 px-1 rounded">ai.assessment.api-key</code> 并重启后端即可启用 AI 动态出题。当前只能使用经典固定题。
          </p>
        </div>
      </div>
    </div>

    <!-- Mode -->
    <div class="mb-6">
      <label class="block text-sm text-slate-400 mb-2">题目模式</label>
      <div class="flex gap-2">
        <button (click)="mode.set('ai')"
          class="px-4 py-2 rounded text-sm font-medium transition-all"
          [class.bg-blue-600]="mode() === 'ai'"
          [class.text-white]="mode() === 'ai'"
          [class.bg-slate-700]="mode() !== 'ai'"
          [class.text-slate-400]="mode() !== 'ai'"
          [class.opacity-60]="!aiAvailable && mode() !== 'ai'">
          AI 动态出题
        </button>
        <button (click)="mode.set('fixed')"
          class="px-4 py-2 rounded text-sm font-medium transition-all"
          [class.bg-blue-600]="mode() === 'fixed'"
          [class.text-white]="mode() === 'fixed'"
          [class.bg-slate-700]="mode() !== 'fixed'"
          [class.text-slate-400]="mode() !== 'fixed'">
          经典固定题
        </button>
      </div>
      <p *ngIf="mode() === 'fixed'" class="text-xs text-slate-500 mt-2">使用预设的 5 道算法理解题，无需 AI 服务。</p>
    </div>

    <!-- AI-only settings -->
    <ng-container *ngIf="mode() === 'ai'">
      <!-- Difficulty -->
      <div class="mb-6">
        <label class="block text-sm text-slate-400 mb-2">难度等级</label>
        <div class="flex gap-2 flex-wrap">
          <span *ngFor="let d of difficulties"
            (click)="difficulty.set(d.value)"
            class="px-4 py-1.5 rounded text-sm font-medium transition-all cursor-pointer select-none"
            [class.bg-blue-600]="difficulty() === d.value"
            [class.text-white]="difficulty() === d.value"
            [class.bg-slate-700]="difficulty() !== d.value"
            [class.text-slate-300]="difficulty() !== d.value"
            role="button">
            {{ d.label }}
          </span>
        </div>
      </div>

      <!-- Categories -->
      <div class="mb-6">
        <label class="block text-sm text-slate-400 mb-2">覆盖范围</label>
        <div class="space-y-2">
          <div *ngFor="let cat of allCategories"
            class="bg-slate-800/50 border border-slate-700 rounded-lg overflow-hidden">
            <div class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-slate-800 transition-colors"
              (click)="toggleCategory(cat)">
              <input type="checkbox"
                [checked]="isCategoryChecked(cat)"
                class="rounded bg-slate-700 border-slate-600 text-blue-600 focus:ring-blue-500 pointer-events-none" />
              <span class="text-sm text-slate-200">{{ categoryLabels[cat] }}</span>
              <span class="text-xs text-slate-500 ml-auto">
                {{ getAlgoCountForCategory(cat) }}/{{ getTotalAlgoCountForCategory(cat) }}
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Question Types -->
      <div class="mb-6">
        <label class="block text-sm text-slate-400 mb-2">题型偏好 <span class="text-slate-600">(至少选一种)</span></label>
        <div class="flex gap-2">
          <span *ngFor="let type of allQuestionTypes"
            (click)="toggleQuestionType(type)"
            class="px-4 py-1.5 rounded text-sm font-medium transition-all cursor-pointer select-none"
            [class.bg-blue-600]="isTypeChecked(type)"
            [class.text-white]="isTypeChecked(type)"
            [class.bg-slate-700]="!isTypeChecked(type)"
            [class.text-slate-400]="!isTypeChecked(type)"
            role="button">
            {{ questionTypeLabels[type] }}
          </span>
        </div>
      </div>
    </ng-container>

    <!-- Start button -->
    <button
      (click)="startAssessment()"
      class="w-full py-3 rounded-lg font-bold text-white transition-all"
      [class.bg-blue-600]="mode() === 'ai'"
      [class.hover:bg-blue-500]="mode() === 'ai'"
      [class.bg-green-600]="mode() === 'fixed'"
      [class.hover:bg-green-500]="mode() === 'fixed'"
      [class.opacity-60]="mode() === 'ai' && (getFlatAlgorithms().length === 0 || (mode() === 'ai' && !aiAvailable))"
      [class.cursor-not-allowed]="mode() === 'ai' && (getFlatAlgorithms().length === 0 || (mode() === 'ai' && !aiAvailable))"
      [disabled]="mode() === 'ai' && getFlatAlgorithms().length === 0">
      <span *ngIf="mode() === 'ai'">🤖 开始 AI 出题（{{ questionCount() }} 题）</span>
      <span *ngIf="mode() === 'fixed'">开始答题（5 题）</span>
    </button>

    <p *ngIf="mode() === 'ai' && getFlatAlgorithms().length === 0"
      class="text-xs text-red-400 mt-2 text-center">请至少选择一个分类下的算法</p>

  </div>
</div>
