spring.application.name=algorithm-viz-backend
server.port=8080

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/algorithm_viz?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# AI complexity API
ai.complexity.api-url=https://llmapi.paratera.com/v1/chat/completions
ai.complexity.api-key=${AI_COMPLEXITY_API_KEY:}
ai.complexity.model=DeepSeek-V3.2

# AI assessment API (独立配置，支持不同模型)
ai.assessment.api-url=http://1517457097276560.cn-wulanchabu.pai-eas.aliyuncs.com/api/predict/minimax_27_int8/v1/chat/completions
ai.assessment.api-key=${AI_ASSESSMENT_API_KEY:}
ai.assessment.model=minimax-2.7-INT88
